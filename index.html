<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>資金行為學 · 認知戰情室</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg-page:#f5f6fa; --bg-card:#ffffff; --bg-section:#f8f9fc;
      --border:#e5e7ef; --txt-pri:#1a1a2e; --txt-sec:#4a4a6a; --txt-mut:#9098b0;
      --bar-track:#e8eaf2; --green:#059c55; --blue:#0077bb;
      --amber:#c97a00; --red:#dc2626; --purple:#7c3aed;
      --up:#dc2626; --down:#059c55;
      --risk-on:#0077bb; --risk-off:#7c3aed; --core:#059c55;
    }
    body { background:var(--bg-page); color:var(--txt-pri); font-family:'PingFang TC','Noto Sans TC',sans-serif; min-height:100vh; }

    /* ── HEADER ── */
    .header { background:var(--bg-card); border-bottom:1px solid var(--border); padding:14px 16px; position:sticky; top:0; z-index:100; box-shadow:0 1px 6px rgba(0,0,0,0.06); }
    .header-inner { max-width:900px; margin:0 auto; }
    .header-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    .app-label { font-size:9px; color:var(--txt-mut); letter-spacing:4px; margin-bottom:2px; }
    .app-title { font-size:18px; font-weight:900; color:var(--txt-pri); }
    .app-sub   { font-size:12px; font-weight:400; color:var(--txt-mut); margin-left:8px; }
    .header-right { text-align:right; flex-shrink:0; }
    .regime-lbl  { font-size:9px; color:var(--txt-mut); margin-bottom:2px; }
    .regime-name { font-size:13px; font-weight:800; }
    .regime-idx  { font-size:11px; color:var(--txt-mut); font-family:monospace; }
    .tabs { display:flex; margin-top:10px; border-bottom:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .tab-btn { padding:7px 16px; border:none; cursor:pointer; background:transparent; color:var(--txt-mut); border-bottom:2px solid transparent; font-size:13px; font-family:inherit; font-weight:400; white-space:nowrap; transition:all 0.15s; flex-shrink:0; }
    .tab-btn.active { color:var(--blue); border-bottom-color:var(--blue); font-weight:700; }

    /* ── BODY ── */
    .body { max-width:900px; margin:0 auto; padding:16px 14px; }

    /* ── REGIME SUGGESTION BANNER ── */
    .regime-suggest {
      border-radius:10px; padding:10px 16px; margin-bottom:14px;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      border:1px solid; font-size:12px;
    }
    .regime-suggest-icon { font-size:18px; flex-shrink:0; }
    .regime-suggest-text { flex:1; line-height:1.5; }
    .regime-suggest-btn  { padding:5px 12px; border-radius:20px; border:none; cursor:pointer; font-size:11px; font-weight:700; font-family:inherit; }

    /* ── MIGRATION METER ── */
    .migration-bar {
      background:var(--bg-card); border:1px solid var(--border);
      border-radius:10px; padding:12px 16px; margin-bottom:14px;
    }
    .migration-title { font-size:10px; color:var(--txt-mut); letter-spacing:2px; margin-bottom:8px; font-weight:600; }
    .migration-track { position:relative; height:8px; background:var(--bar-track); border-radius:4px; overflow:hidden; margin-bottom:6px; }
    .migration-fill-on  { position:absolute; left:0; top:0; height:8px; background:var(--risk-on); border-radius:4px 0 0 4px; transition:width 0.8s ease; }
    .migration-fill-off { position:absolute; right:0; top:0; height:8px; background:var(--risk-off); border-radius:0 4px 4px 0; transition:width 0.8s ease; }
    .migration-labels { display:flex; justify-content:space-between; font-size:11px; }
    .migration-verdict { text-align:center; font-size:12px; font-weight:700; margin-top:4px; }

    /* ── BATTLEFIELD CONTROLS ── */
    .bf-controls { margin-bottom:14px; }
    .bf-pills { display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; }
    .bf-pill {
      padding:8px 16px; border-radius:20px; cursor:pointer; border:2px solid var(--border);
      background:var(--bg-card); color:var(--txt-sec); font-size:12px; font-weight:600;
      font-family:inherit; white-space:nowrap; flex-shrink:0; transition:all 0.2s;
    }
    .bf-pill.active-core    { border-color:var(--core);    background:rgba(5,156,85,0.08);   color:var(--core);    }
    .bf-pill.active-risk_on { border-color:var(--risk-on); background:rgba(0,119,187,0.08);  color:var(--risk-on); }
    .bf-pill.active-risk_off{ border-color:var(--risk-off);background:rgba(124,58,237,0.08); color:var(--risk-off);}
    .score-filter-row { display:flex; gap:4px; overflow-x:auto; }
    .pill { padding:6px 12px; border-radius:20px; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--txt-sec); font-size:11px; font-family:inherit; white-space:nowrap; flex-shrink:0; transition:all 0.15s; }
    .pill.active { border-color:var(--blue); background:rgba(0,119,187,0.1); color:var(--blue); font-weight:700; }

    /* ── LOADING / ERROR ── */
    .loading-box { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:20px 16px; text-align:center; margin-bottom:14px; }
    .progress-track { background:var(--bar-track); border-radius:4px; height:4px; overflow:hidden; }
    .progress-bar { height:4px; border-radius:4px; width:100%; background:linear-gradient(90deg,var(--green),var(--blue)); animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .loading-msg { font-size:13px; color:var(--txt-sec); margin-top:8px; }
    .error-box { background:#fff5f5; border:1px solid rgba(220,38,38,0.3); border-radius:10px; padding:12px 16px; margin-bottom:14px; font-size:13px; color:var(--red); line-height:1.6; }

    /* ── STOCK CARD ── */
    .card { background:var(--bg-card); border-radius:12px; padding:14px 16px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.06); transition:all 0.2s; margin-bottom:10px; border:1px solid var(--border); border-left-width:4px; }
    .card-header { display:flex; align-items:center; gap:12px; }
    .card-info { flex:1; min-width:0; }
    .card-name-row { display:flex; align-items:center; gap:5px; margin-bottom:5px; flex-wrap:wrap; }
    .stock-name { font-size:16px; font-weight:900; color:var(--txt-pri); }
    .stock-id { font-size:11px; color:var(--txt-mut); background:var(--bg-section); padding:1px 7px; border-radius:5px; border:1px solid var(--border); }
    .chip { display:inline-block; font-size:10px; font-weight:700; border-radius:20px; padding:2px 8px; white-space:nowrap; }
    .role-tag { display:inline-block; font-size:9px; color:var(--txt-mut); background:var(--bg-section); border:1px solid var(--border); border-radius:4px; padding:1px 6px; white-space:nowrap; }
    .card-price-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .stock-price  { font-size:19px; font-weight:800; font-family:monospace; }
    .stock-change { font-size:13px; font-weight:700; }
    .stock-date   { font-size:11px; color:var(--txt-mut); }
    .card-toggle  { font-size:16px; color:var(--txt-mut); flex-shrink:0; }
    .score-bars { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:12px; }
    .bar-label { display:flex; justify-content:space-between; font-size:11px; color:var(--txt-sec); margin-bottom:3px; }
    .bar-track { background:var(--bar-track); border-radius:4px; height:6px; overflow:hidden; }
    .bar-fill  { height:6px; border-radius:4px; transition:width 0.8s ease; }

    /* ── EXPANDED ── */
    .expanded-body { margin-top:14px; border-top:1px solid var(--border); padding-top:14px; }
    .sec-title { font-size:10px; letter-spacing:2px; margin-bottom:7px; font-weight:600; }
    .translation-box { border-radius:10px; padding:10px 14px; margin-bottom:12px; }
    .translation-text { font-size:13px; color:var(--txt-pri); line-height:1.85; font-style:italic; border-left:3px solid; padding-left:10px; }
    .data-section { background:var(--bg-section); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
    .metrics-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .metric-cell { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
    .metric-label { font-size:10px; color:var(--txt-mut); margin-bottom:3px; }
    .metric-value { font-size:13px; font-weight:800; font-family:monospace; }
    .inst-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
    .inst-cell { background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:10px 12px; text-align:center; }
    .inst-val { font-size:20px; font-weight:900; font-family:monospace; }
    .inst-lbl { font-size:11px; color:var(--txt-mut); margin-bottom:4px; }
    .trend-bars { display:flex; gap:5px; margin-top:8px; }
    .trend-cell { flex:1; text-align:center; border-radius:6px; padding:4px 2px; border:1px solid; }
    .trend-val  { font-size:11px; font-weight:700; font-family:monospace; }
    .warn-box { background:#fffbeb; border:1px solid rgba(201,122,0,0.3); border-radius:8px; padding:9px 12px; font-size:11px; color:var(--amber); line-height:1.7; margin-top:10px; }

    /* ── WATCHLIST ── */
    .wl-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .wl-title  { font-size:16px; font-weight:800; }
    .wl-count  { font-size:12px; color:var(--txt-mut); margin-top:2px; }
    .wl-search-wrap { position:relative; width:100%; max-width:400px; margin-bottom:14px; }
    .wl-search { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:14px; font-family:inherit; background:var(--bg-card); color:var(--txt-pri); outline:none; }
    .wl-search:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,119,187,0.1); }
    .wl-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.1); z-index:50; max-height:240px; overflow-y:auto; display:none; }
    .wl-dropdown.show { display:block; }
    .wl-option { padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--border); transition:background 0.1s; }
    .wl-option:last-child { border-bottom:none; }
    .wl-option:hover { background:var(--bg-section); }
    .wl-opt-id   { font-size:13px; font-weight:700; color:var(--blue); font-family:monospace; min-width:42px; }
    .wl-opt-name { font-size:13px; color:var(--txt-pri); }
    .wl-list { display:flex; flex-direction:column; gap:6px; }
    .wl-item { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:11px 14px; display:flex; align-items:center; gap:10px; }
    .wl-item-num  { font-size:12px; color:var(--txt-mut); min-width:20px; }
    .wl-item-id   { font-size:14px; font-weight:800; color:var(--blue); font-family:monospace; min-width:44px; }
    .wl-item-name { font-size:14px; font-weight:600; flex:1; }
    .wl-item-role { font-size:10px; color:var(--txt-mut); background:var(--bg-section); padding:2px 8px; border-radius:8px; border:1px solid var(--border); }
    .btn-del { width:28px; height:28px; border-radius:50%; border:1px solid rgba(220,38,38,0.3); background:#fff5f5; color:var(--red); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .btn-del:hover { background:var(--red); color:#fff; }
    .wl-empty { text-align:center; padding:32px 0; color:var(--txt-mut); font-size:14px; }
    .btn-scan-wl { margin-top:16px; width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer; background:linear-gradient(135deg,var(--green),var(--blue)); color:#fff; font-weight:800; font-size:15px; font-family:inherit; }

    .footer { text-align:center; padding:20px; font-size:10px; color:var(--txt-mut); border-top:1px solid var(--border); margin-top:40px; }
    @media (max-width:480px) { .score-bars { grid-template-columns:1fr; } .metrics-grid { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div>
        <div class="app-label">CAPITAL BEHAVIOR ANALYTICS</div>
        <div class="app-title">資金行為學<span class="app-sub">認知戰情室 v2.0</span></div>
      </div>
      <div class="header-right" id="regime-box" style="display:none">
        <div class="regime-lbl">市場環境</div>
        <div class="regime-name" id="regime-name"></div>
        <div class="regime-idx"  id="regime-idx"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('scanner',this)">戰情掃描</button>
      <button class="tab-btn"        onclick="switchTab('watchlist',this)">觀察名單</button>
    </div>
  </div>
</div>

<!-- BODY -->
<div class="body">

  <!-- SCANNER TAB -->
  <div id="tab-scanner">

    <!-- Regime 建議橫幅 -->
    <div class="regime-suggest" id="regime-suggest" style="display:none"></div>

    <!-- 資金遷徙儀表板 -->
    <div class="migration-bar" id="migration-bar" style="display:none">
      <div class="migration-title">◈ 資金遷徙雷達</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;color:var(--risk-on);font-weight:700;min-width:80px">🚀 Risk-On</span>
        <div class="migration-track" style="flex:1">
          <div class="migration-fill-on"  id="mig-on-bar"></div>
          <div class="migration-fill-off" id="mig-off-bar"></div>
        </div>
        <span style="font-size:11px;color:var(--risk-off);font-weight:700;min-width:80px;text-align:right">🛡️ Risk-Off</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--txt-mut)">
        <span>均分 <b id="mig-on-score" style="color:var(--risk-on)">—</b></span>
        <div class="migration-verdict" id="mig-verdict"></div>
        <span>均分 <b id="mig-off-score" style="color:var(--risk-off)">—</b></span>
      </div>
    </div>

    <!-- 作戰群組切換 -->
    <div class="bf-controls">
      <div class="bf-pills">
        <button class="bf-pill active-core" id="bf-core"
          onclick="changeBattlefield('core',this)">
          🎯 核心雷達（市場心跳）
        </button>
        <button class="bf-pill" id="bf-risk_on"
          onclick="changeBattlefield('risk_on',this)">
          🚀 Risk-On 夢境擴散群
        </button>
        <button class="bf-pill" id="bf-risk_off"
          onclick="changeBattlefield('risk_off',this)">
          🛡️ Risk-Off 防禦循環群
        </button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn-scan" id="btn-scan" onclick="runScan()">▶ 開始掃描</button>
        <div class="score-filter-row">
          <button class="pill active" onclick="setFilter('all',this)">全部</button>
          <button class="pill"        onclick="setFilter('hot',this)">🔥 重點</button>
          <button class="pill"        onclick="setFilter('watch',this)">👁 觀察</button>
        </div>
      </div>
    </div>

    <div class="loading-box" id="loading-box" style="display:none">
      <div class="progress-track"><div class="progress-bar"></div></div>
      <div class="loading-msg" id="loading-msg">載入中…</div>
    </div>
    <!-- 快取狀態提示列 -->
    <div id="cache-hint" style="display:none;padding:9px 14px;margin-bottom:10px;
      background:#f0fdf4;border:1px solid rgba(5,156,85,0.3);border-radius:8px;
      font-size:12px;color:var(--green);font-weight:600"></div>
    <div class="error-box" id="error-box" style="display:none"></div>
    <div id="results-list"></div>
  </div>

  <!-- WATCHLIST TAB -->
  <div id="tab-watchlist" style="display:none">
    <div class="wl-header">
      <div>
        <div class="wl-title">觀察名單管理</div>
        <div class="wl-count" id="wl-count"></div>
      </div>
      <button onclick="resetWatchlist()" style="padding:6px 14px;border-radius:8px;
        border:1px solid var(--border);background:var(--bg-section);
        color:var(--txt-mut);cursor:pointer;font-size:12px;font-family:inherit;">
        ↺ 重設為預設值
      </button>
    </div>
    <div class="wl-search-wrap">
      <input class="wl-search" id="wl-search" type="text"
        placeholder="輸入代號或名稱搜尋新增…"
        oninput="onSearchInput(this.value)"
        onblur="setTimeout(()=>hideDropdown(),200)"
        autocomplete="off"/>
      <div class="wl-dropdown" id="wl-dropdown"></div>
    </div>
    <div class="wl-list"  id="wl-list"></div>
    <div class="wl-empty" id="wl-empty" style="display:none">名單是空的，請搜尋新增股票</div>
    <button class="btn-scan-wl"
      onclick="switchTab('scanner',document.querySelector('.tab-btn'));runScan()">
      ▶ 開始掃描觀察名單
    </button>
  </div>
</div>

<div class="footer">資金行為學 v2.0 ｜ TWSE 即時數據 ｜ AI 只做結構翻譯，不做漲跌預測</div>

<script>
// ══════════════════════════════════════════════════════
// 雙星作戰群組定義
// ══════════════════════════════════════════════════════
const CORE_RADAR = [

  {id:"2408",name:"南亞科",  theme:"記憶體",    role:"記憶體循環"},

const BATTLEFIELDS = {
  risk_on: [
    {id:"2330",name:"台積電",  theme:"半導體核心",   role:"index_anchor"},
    {id:"2317",name:"鴻海",    theme:"AI伺服器/代工",role:"large_cap_barometer"},
    {id:"2454",name:"聯發科",  theme:"IC設計",       role:"leader_candidate"},
    {id:"3661",name:"世芯-KY", theme:"ASIC",         role:"high_beta_leader"},
    {id:"3443",name:"創意",    theme:"ASIC",         role:"high_beta_beta"},
    {id:"6669",name:"緯穎",    theme:"AI伺服器",     role:"momentum_leader"},
    {id:"2382",name:"廣達",    theme:"AI伺服器",     role:"sector_barometer"},
    {id:"3231",name:"緯創",    theme:"AI伺服器",     role:"sector_beta"},
    {id:"3017",name:"奇鋐",    theme:"散熱",         role:"supply_chain_leader"},

    {id:"2359",name:"所羅門",  theme:"機器人",       role:"theme_beta"},
  ],
  risk_off: [
    {id:"2603",name:"長榮",  theme:"航運",          role:"cycle_leader"},
    {id:"2609",name:"陽明",  theme:"航運",          role:"cycle_beta"},
    {id:"2615",name:"萬海",  theme:"航運",          role:"cycle_beta"},
    {id:"3034",name:"聯詠",  theme:"IC/高殖利率",   role:"yield_quality"},
    {id:"2379",name:"瑞昱",  theme:"IC/高殖利率",   role:"yield_quality"},
    {id:"4938",name:"和碩",  theme:"代工/高殖利率", role:"yield_value"},
    {id:"2408",name:"南亞科",theme:"記憶體",        role:"cycle_turnaround"},
    {id:"8299",name:"群聯",  theme:"記憶體/控制IC", role:"cycle_turnaround"},
  ],
};

// 當前群組
let currentBF = "core";

// Regime 建議映射
function getRecommendedBF(regime) {
  if (regime === "溫床市場")  return "risk_on";
  if (regime === "墳場市場")  return "core";
  return "risk_off"; // 混沌輪動盤
}

// ══════════════════════════════════════════════════════
// 股票名稱查詢
// ══════════════════════════════════════════════════════
let stockMap = {};

async function loadStockList() {
  // 同時抓上市（TWSE）與上櫃（TPEx），合併成同一張對照表

let watchlist = [...CORE_RADAR];

function addToWatchlist(stock) {
  if (watchlist.find(w=>w.id===stock.id)) return;
  if (watchlist.length >= 20) { alert("觀察名單最多 20 支"); return; }
  watchlist.push(stock);
  saveWatchlist();       // ← 每次新增立即存檔
  renderWatchlist();
  document.getElementById("wl-search").value = "";
  hideDropdown();
}

function removeFromWatchlist(id) {
  watchlist = watchlist.filter(w=>w.id!==id);
  saveWatchlist();       // ← 每次刪除立即存檔
  renderWatchlist();
}

function renderWatchlist() {
  const list  = document.getElementById("wl-list");
  const empty = document.getElementById("wl-empty");
  document.getElementById("wl-count").textContent = `共 ${watchlist.length} 支 / 最多 20 支`;
  if (!watchlist.length) { list.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display = "none";
  list.innerHTML = watchlist.map((s,i) => `
    <div class="wl-item">
      <span class="wl-item-num">${i+1}</span>
      <span class="wl-item-id">${s.id}</span>
      <span class="wl-item-name">${s.name}</span>
      ${s.role ? `<span class="wl-item-role">${s.role}</span>` : ""}
      <button class="btn-del" onclick="removeFromWatchlist('${s.id}')">✕</button>
    </div>`).join("");
}

function recentMonths(n) {
  const r = [], d = new Date();
  for (let i = 0; i < n; i++) {
    r.push(`${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}`);
    d.setMonth(d.getMonth() - 1);
  }
  return r;
}

async function twseFetch(url, params = {}) {
  const qs = new URLSearchParams({ ...params, response: "json" }).toString();
  for (let i = 0; i < 3; i++) {
    try {
      if (i > 0) await sleep(800 * i);
      const r = await fetch(`${url}?${qs}`, {
        headers: { "Accept": "application/json", "Referer": "https://www.twse.com.tw/" },
        mode: "cors",
      });
      if (!r.ok) continue;
      const d = await r.json();
      if (d?.stat === "OK" || d?.data) return d;
    } catch {}
  }
  return null;
}

async function denoFetch(path) {
  for (let i = 0; i < 3; i++) {
    try {
      if (i > 0) await sleep(800 * i);
      const r = await fetch(`${DENO_PROXY}${path}`);
      if (!r.ok) continue;
      return await r.json();
    } catch {}
  }
  return null;
}

  for (const ym of months) {
    const data = await twseFetch(`${TWSE}/afterTrading/STOCK_DAY`, { stockNo: stockId, date: ym + "01" });
    for (const row of (data?.data || [])) {
      try {
        const c = parseFloat(row[6].replace(/,/g, "")),
              v = Math.floor(parseInt(row[1].replace(/,/g, "")) / 1000);
        if (!isNaN(c) && c > 0) rows.push({ date: row[0], close: c, volume: v });
      } catch {}
    }

}

function buildPriceResult(stockId, rows) {
  if (rows.length < 5) return null;
  rows.sort((a, b) => a.date.localeCompare(b.date));
  const closes = rows.map(r => r.close), volumes = rows.map(r => r.volume);
  const latest = rows[rows.length - 1], prev = rows[rows.length - 2] || latest;
  const avg = (arr, n) => arr.length >= n ? arr.slice(-n).reduce((s, v) => s + v, 0) / n : null;
  return {
    stockId, price: latest.close,
    changePct: +(((latest.close - prev.close) / prev.close) * 100).toFixed(2),
    above20ma: avg(closes, 20) ? latest.close > avg(closes, 20) : null,
    ma20: avg(closes, 20) ? +avg(closes, 20).toFixed(2) : null,
    ma60: avg(closes, 60) ? +avg(closes, 60).toFixed(2) : null,
    vol5avg:  avg(volumes, 5)  ? Math.round(avg(volumes, 5))  : null,
    vol20avg: avg(volumes, 20) ? Math.round(avg(volumes, 20)) : null,
    dataDate: latest.date,
  };
}

// ── 全域評分快取：同一支股票同一次掃描只計算一次
// key = stockId，value = score 物件
// 每次 runScan() 開始時清空
const _scoreCache = {};

function detectMode(inst) {
  if (!inst || (!inst.sitDays && !inst.foreignDays && !(inst.recent5Sit?.length))) return "C";
  return "B";
}

function normalizeScore(raw, mode) {
  // ★ 修正：動態查天花板，不再寫死 75
  const ceiling = MODE_CONFIG[mode]?.ceiling ?? 50;
  return Math.min((raw / ceiling) * 100, 100);
}

function calcScore(price, inst) {
  if (!price) return null;

  // ── 快取命中：同一支股票本次掃描已算過，直接回傳
  const cacheKey = price.stockId;
  if (cacheKey && _scoreCache[cacheKey]) return _scoreCache[cacheKey];

  const mode   = detectMode(inst);
  const rs     = price.changePct || 0;
  const above  = price.above20ma || false;
  const vr     = (price.vol5avg && price.vol20avg)
                 ? price.vol5avg / price.vol20avg : 1;
  const { sitDays=0, foreignDays=0, sitBuy=false } = inst || {};

  // ── 各維度原始分
  const rsScore     = rs>=3&&above ? 25 : rs>=1 ? 18 : rs>=0 ? 10 : 0;
  const instScore   = sitDays>=3   ? 15
                    : foreignDays>=3&&!sitBuy ? 8
                    : sitDays*1.5+foreignDays*0.5>=3 ? 10
                    : sitDays*1.5+foreignDays*0.5>=1 ? 5 : 0;
  const healthScore = vr<=0.7 ? 20 : vr<=0.85 ? 12 : 6;

  // B/C 模式：籌碼維度保守處理
  const chipsScore = mode==="C" ? 0
                   : mode==="A" ? (sitDays>=3?22:sitDays>=2?18:foreignDays>=3?14:8)
                   : (sitDays>=1 ? 10 : foreignDays>=1 ? 6 : 3); // B 模式保守

  const raw  = Math.min(rsScore + chipsScore + instScore + healthScore + 15, 100);
  const norm = normalizeScore(raw, mode);
  const thr  = MODE_CONFIG[mode]?.threshold ?? 85;

  // ── 決策模式狀態機（完全體三道鎖）
  // 使用全域 regime 判斷市場環境（已在 runScan 取得）
  const isWarmMarket = regime?.regime === "溫床市場";

  let dm, maxPos;
  if (mode === "A") {
    dm = "A_HUNT";
    maxPos = POSITION_CAP.A_HUNT;
  } else if (mode === "B_PLUS") {
    // B+ 只在分數夠高時允許跟蹤，否則觀望
    dm = norm >= thr ? "B_TRACK" : "C_OBSERVE";
    maxPos = dm === "B_TRACK" ? POSITION_CAP.B_TRACK : POSITION_CAP.C_OBSERVE;
  } else if (mode === "B") {
    // B 模式：分數達標才允許代理跟蹤
    dm = norm >= thr ? "B_PROXY_TRACK" : "C_OBSERVE";
    maxPos = dm === "B_PROXY_TRACK" ? POSITION_CAP.B_PROXY_TRACK : POSITION_CAP.C_OBSERVE;
  } else {
    // ★ C 模式三道鎖：溫床市場 + 正規化高分 + 收盤在 20MA 之上
    if (isWarmMarket && norm >= 85 && above) {
      dm = "C_SCOUT";
      maxPos = POSITION_CAP.C_SCOUT;
    } else {
      dm = "C_OBSERVE";
      maxPos = POSITION_CAP.C_OBSERVE;
    }
  }

  const signal = norm >= thr && dm !== "C_OBSERVE";

  // ── 語意翻譯
  let label, color, msg;
  if (!signal || dm === "C_OBSERVE") {
    label = "冷眼旁觀"; color = "var(--txt-mut)";
    msg   = "結構條件未達標準或資料解析度不足。此時進場為盲目行動。";
  } else if (norm >= 85) {
    label = dm === "C_SCOUT" ? "有限防衛試單" : "等待Trigger";
    color = "var(--green)";
    msg   = dm === "C_SCOUT"
      ? "濃霧中偵測到強勢結構，允許 5% 試單，停損收緊 30%，嚴禁加碼。"
      : "深海章魚正在低調完成最後收集，浮額大量消失。請保持獵人耐心，等待觸發。";
  } else if (norm >= 75) {
    label = "籌碼沉澱中"; color = "var(--blue)";
    msg   = sitDays >= 2
      ? "深海章魚正在低調收集，市場尚未察覺。請保持獵人耐心，切勿提早追價。"
      : "主力足跡清晰，籌碼結構健康。等待量縮完成後的突破訊號。";
  } else {
    label = "疑似吸籌"; color = "var(--amber)";
    msg   = "有潛在主力跡象，但結構尚未成熟。列入觀察名單持續追蹤。";
  }

  const result = {
    total: Math.round(norm), raw, label, color, msg,
    mode, dm, maxPos,
    scores: { rsScore, chipsScore, instScore, healthScore, liquidScore:15 },
    volRatio: vr.toFixed(2),
  };

  // ── 存入快取，同一次掃描不重複計算
  if (cacheKey) _scoreCache[cacheKey] = result;
  return result;
}

// ══════════════════════════════════════════════════════
// 資金遷徙計算（由 calcMigrationFromCache 取代）
// ══════════════════════════════════════════════════════

function renderMigration(mig) {
  const bar=document.getElementById("migration-bar");
  if(!mig||(!mig.onAvg&&!mig.offAvg)){bar.style.display="none";return;}
  bar.style.display="block";
  const total=mig.onAvg+mig.offAvg||1;
  const onPct=(mig.onAvg/total*100).toFixed(1);
  const offPct=(mig.offAvg/total*100).toFixed(1);
  document.getElementById("mig-on-bar").style.width=onPct+"%";
  document.getElementById("mig-off-bar").style.width=offPct+"%";
  document.getElementById("mig-on-score").textContent=
    `${mig.onAvg}${mig.onN?` (n=${mig.onN})`:""}`;
  document.getElementById("mig-off-score").textContent=
    `${mig.offAvg}${mig.offN?` (n=${mig.offN})`:""}`;
  const spread=mig.onAvg-mig.offAvg;
  let verdict, vc;
  if(spread>=12){verdict="🚀 資金性格：進攻型";vc="var(--risk-on)";}
  else if(spread<=-12){verdict="🛡️ 資金性格：防禦輪動";vc="var(--risk-off)";}
  else if(spread>=5){verdict="↗️ 輕微偏向進攻";vc="var(--blue)";}
  else if(spread<=-5){verdict="↘️ 輕微偏向防禦";vc="var(--purple)";}
  else{verdict="⚖️ 資金性格：觀望均衡";vc="var(--amber)";}
  const vd=document.getElementById("mig-verdict");
  vd.textContent=verdict; vd.style.color=vc; vd.style.fontWeight=700;
}

// ══════════════════════════════════════════════════════
// 主掃描 + 背景雙群組掃描（遷徙雷達永遠有數據）
// ══════════════════════════════════════════════════════
let stockData=[],filterMode="all",expandedId=null,regime=null;
// 背景快取：儲存雙群組最新分數，供遷徙雷達使用
const _bgCache = { risk_on:[], risk_off:[] };

// 掃描單支股票（共用）
async function scanOne(sid, meta={}) {
  try {
    const price = await getStockPrice(sid);
    const inst  = await getInstitutional(sid);
    const score = calcScore(price, inst);
    if (score) return {stockId:sid, name:getStockName(sid), price, inst, score, meta};
  } catch {}
  return null;
}

async function runScan(){
  setLoading(true); setError(null); stockData=[]; renderResults();
  // 清空法人快取與評分快取，確保每次掃描都是乾淨的
  Object.keys(_instCache).forEach(k=>delete _instCache[k]);
  Object.keys(_scoreCache).forEach(k=>delete _scoreCache[k]);
  try{
    setMsg("取得大盤環境…");
    regime = await getMarketRegime();
    renderRegime(regime);
    renderRegimeSuggest(regime);

    // ── 掃描當前觀察名單（主流程）
    const ids = watchlist.map(w=>w.id);
    for(let i=0;i<ids.length;i++){
      const sid=ids[i];
      setMsg(`掃描 ${sid} ${getStockName(sid)}（${i+1}/${ids.length}）…`);
      const result = await scanOne(sid, watchlist.find(w=>w.id===sid)||{});
      if(result) stockData.push(result);
      await sleep(500);
    }
    stockData.sort((a,b)=>b.score.total-a.score.total);
    renderResults();

    // ── 把掃描結果同步到背景快取（供遷徙雷達使用）
    for(const d of stockData){
      if(BATTLEFIELDS.risk_on.find(s=>s.id===d.stockId))
        _bgCache.risk_on=_bgCache.risk_on.filter(x=>x.stockId!==d.stockId).concat([d]);
      if(BATTLEFIELDS.risk_off.find(s=>s.id===d.stockId))
        _bgCache.risk_off=_bgCache.risk_off.filter(x=>x.stockId!==d.stockId).concat([d]);
    }

    // ── 計算遷徙（用背景快取雙邊分數）
    renderMigration(calcMigrationFromCache());

    // ── 背景補掃另一陣營（不影響主畫面，靜默填充遷徙雷達）
    const otherKey = currentBF==="risk_on" ? "risk_off"
                   : currentBF==="risk_off"? "risk_on"
                   : null;
    if(otherKey) bgScanGroup(otherKey);

  }catch(e){setError(`掃描失敗：${e.message}`);}
  finally{setLoading(false);}
}

// 背景靜默掃描另一陣營（不顯示 loading，只更新遷徙雷達）
async function bgScanGroup(groupKey){
  const group = BATTLEFIELDS[groupKey];
  const needScan = group.filter(s=>!_bgCache[groupKey].find(c=>c.stockId===s.id));
  for(const s of needScan){
    await sleep(800); // 背景掃描間隔放寬，避免與主流程競爭
    const result = await scanOne(s.id, s);
    if(result){
      _bgCache[groupKey] = _bgCache[groupKey]
        .filter(c=>c.stockId!==s.id).concat([result]);
      renderMigration(calcMigrationFromCache()); // 每掃一支就即時更新遷徙雷達
    }
  }
}

function calcMigrationFromCache(){
  const avg = arr => arr.length
    ? Math.round(arr.reduce((s,d)=>s+(d.score?.total||0),0)/arr.length) : 0;
  return {
    onAvg:  avg(_bgCache.risk_on),
    offAvg: avg(_bgCache.risk_off),
    onN:    _bgCache.risk_on.length,
    offN:   _bgCache.risk_off.length,
  };
}

// ══════════════════════════════════════════════════════
// 作戰群組切換
// ══════════════════════════════════════════════════════
async function changeBattlefield(groupKey, btn) {
  currentBF = groupKey;
  saveBattlefield(groupKey);
  ["core","risk_on","risk_off"].forEach(k => {
    const b = document.getElementById(`bf-${k}`);
    if (b) b.className = `bf-pill${k===groupKey ? ` active-${k}` : ""}`;
  });

  if (groupKey === "core") {
    // 核心雷達：讀 localStorage，沒有才用預設
    const saved = loadSavedWatchlist();
    const enrichName = arr => arr.map(s=>({...s,name:stockMap[s.id]?.name||s.name}));
    watchlist = saved
      ? saved.map(s=>({...s,name:stockMap[s.id]?.name||s.name||s.id}))
      : enrichName([...CORE_RADAR]);
  } else {
    // risk_on / risk_off：永遠用系統定義，不儲存到 localStorage
    watchlist = [...BATTLEFIELDS[groupKey]]
      .map(s=>({...s,name:stockMap[s.id]?.name||s.name}));
  }

  renderWatchlist();

  // risk_on / risk_off 有今日快取則直接顯示，否則掃描
  if (groupKey !== "core" && isBgCacheFresh(groupKey)) {
    stockData = getBgCacheData(groupKey);
    renderResults();
    renderMigration(calcMigrationFromCache());
  } else {
    await runScan();
  }
}

function getFiltered(){
  return stockData.filter(d=>{
    if(filterMode==="hot")  return d.score.total>=75;
    if(filterMode==="watch")return d.score.total>=60&&d.score.total<75;
    return true;
  });
}

function renderResults(){
  const list=document.getElementById("results-list");
  const filtered=getFiltered();
  if(!filtered.length){list.innerHTML=stockData.length?'<div style="text-align:center;color:var(--txt-mut);padding:48px 0">此分類目前無符合條件的個股</div>':"";return;}
  list.innerHTML=filtered.map(d=>cardHTML(d)).join("");
}

function ring(score,color,size){
  const r=size/2-8,c=2*Math.PI*r,d=(score/100)*c;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg);flex-shrink:0"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bar-track)" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="${d.toFixed(1)} ${(c-d).toFixed(1)}" stroke-linecap="round"/><text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central" style="transform:rotate(90deg);transform-origin:${size/2}px ${size/2}px;fill:${color};font-size:${(size*0.21).toFixed(1)}px;font-family:monospace;font-weight:800">${score}</text></svg>`;
}

const LS_BRANCH = "cbv2_branch_notes"; // { stockId: [{branch,netBuy,dtps},...] }

function loadBranchNotes() {
  try { return JSON.parse(localStorage.getItem(LS_BRANCH) || "{}"); } catch { return {}; }
}
function saveBranchNote(stockId, branches) {
  const all = loadBranchNotes();
  all[stockId] = branches;
  try { localStorage.setItem(LS_BRANCH, JSON.stringify(all)); } catch {}
}
function deleteBranchNote(stockId) {
  const all = loadBranchNotes();
  delete all[stockId];
  try { localStorage.setItem(LS_BRANCH, JSON.stringify(all)); } catch {}
}

// 解析從國泰 APP 複製的分點文字
// 支援格式：「凱基台北 買超 8,500 張」或「凱基台北 +8500」等常見格式
function parseBranchText(text) {
  const lines = text.split(/[\n,，;；]+/).map(l => l.trim()).filter(Boolean);
  const results = [];
  for (const line of lines) {
    // 嘗試解析：券商名稱 + 數字（張數）
    const m = line.match(/^(.{2,10}?)\s*[買+＋]\s*超?\s*([0-9,，]+)\s*張?$/);
    if (m) {
      const branch  = m[1].trim();
      const netBuy  = parseInt(m[2].replace(/[,，]/g, ""));
      if (!isNaN(netBuy) && netBuy > 0) {
        results.push({ branch, netBuy, dtps: 30 }); // 預設 dtps=30（混合型）
      }
    }
  }
  return results;
}

// 計算有分點資料時的加強籌碼分數
function calcChipsWithBranch(branches, vol20avg) {
  if (!branches || !branches.length) return null;
  const qwMap = { 0: 0.1, 30: 0.5, 100: 1.0 }; // dtps → qw
  const getQw = dtps => dtps > 70 ? 0.1 : dtps >= 30 ? 0.5 : 1.0;
  const totalNetBuy = branches.reduce((s, b) => s + b.netBuy, 0);
  const weightedBuy = branches.reduce((s, b) => s + b.netBuy * getQw(b.dtps), 0);
  const vol = vol20avg || 10000;
  const wCR5 = Math.min((weightedBuy / (vol * 5)) * 100, 100);
  const dtRatio = branches.filter(b => b.dtps > 70).length / branches.length;
  const isWolf  = dtRatio >= 0.5;
  if (isWolf) return { score: 5, label: "假抗跌警告", wCR5, isWolf: true };
  if (wCR5 >= 30) return { score: 25, label: "主力積極吸籌", wCR5, isWolf: false };
  if (wCR5 >= 20) return { score: 18, label: "籌碼適度集中", wCR5, isWolf: false };
  return { score: 10, label: "籌碼輕微集中", wCR5, isWolf: false };
}

function applyBranchInput(stockId) {
  const ta  = document.getElementById(`branch-input-${stockId}`);
  const txt = ta?.value || "";
  const branches = parseBranchText(txt);
  if (!branches.length) {
    alert("格式解析失敗，請確認格式為：\n券商名稱 買超 張數 張\n例如：凱基台北 買超 8500 張");
    return;
  }
  saveBranchNote(stockId, branches);
  // 清除該股評分快取，強制重算
  delete _scoreCache[stockId];
  // 重新渲染（用已存的 price/inst 數據加入分點重算）
  const existing = stockData.find(d => d.stockId === stockId);
  if (existing) {
    existing.branchData = branches;
    existing.score = calcScoreWithBranch(existing.price, existing.inst, branches);
    renderResults();
  }
}

function clearBranchInput(stockId) {
  deleteBranchNote(stockId);
  delete _scoreCache[stockId];
  const existing = stockData.find(d => d.stockId === stockId);
  if (existing) {
    delete existing.branchData;
    existing.score = calcScore(existing.price, existing.inst);
    renderResults();
  }
}

// 含分點資料的強化評分（接近 A 模式精度）
function calcScoreWithBranch(price, inst, branches) {
  if (!price || !branches?.length) return calcScore(price, inst);
  const branchResult = calcChipsWithBranch(branches, price.vol20avg);
  if (!branchResult) return calcScore(price, inst);

  const mode = "A"; // 有分點資料，升級到 A 模式精度
  const rs    = price.changePct || 0;
  const above = price.above20ma || false;
  const vr    = (price.vol5avg && price.vol20avg) ? price.vol5avg / price.vol20avg : 1;
  const { sitDays=0, foreignDays=0, sitBuy=false } = inst || {};

  const rsScore     = rs>=3&&above?25: rs>=1?18: rs>=0?10:0;
  const instScore   = sitDays>=3?15: foreignDays>=3&&!sitBuy?8:
                      sitDays*1.5+foreignDays*0.5>=3?10: sitDays*1.5+foreignDays*0.5>=1?5:0;
  const healthScore = vr<=0.7?20: vr<=0.85?12:6;
  const chipsScore  = branchResult.isWolf ? 5 : branchResult.score;

  const raw  = Math.min(rsScore + chipsScore + instScore + healthScore + 15, 100);
  const norm = normalizeScore(raw, "A"); // A 模式天花板 100

  const isWarmMarket = regime?.regime === "溫床市場";
  let dm, maxPos;
  if (norm >= 85) { dm = "A_HUNT"; maxPos = POSITION_CAP.A_HUNT; }
  else { dm = "B_TRACK"; maxPos = POSITION_CAP.B_TRACK; }

  let label, color, msg;
  if (branchResult.isWolf) {
    label="剔除 / 假抗跌"; color="var(--red)";
    msg="今日抗跌實為假象，背後堆手為隔日沖狼群，此為拉高倒貨埋伏盤。主力無波段野心，嚴禁列入名單，無情剔除。";
  } else if (norm >= 85) {
    label="等待Trigger"; color="var(--green)";
    msg="分點資料確認主力積極吸籌，籌碼集中度達標。深海章魚已完成收集，等待觸發。";
  } else if (norm >= 75) {
    label="籌碼沉澱中"; color="var(--blue)";
    msg="分點資料顯示主力持續建倉，浮額正在消失。保持耐心，等待量縮完成。";
  } else {
    label="疑似吸籌"; color="var(--amber)";
    msg="分點資料顯示有主力跡象，但集中度尚未達標。持續觀察。";
  }

  return {
    total: Math.round(norm), raw, label, color, msg,
    mode: "A（分點加強）", dm, maxPos,
    scores: { rsScore, chipsScore, instScore, healthScore, liquidScore:15 },
    volRatio: vr.toFixed(2),
    branchEnhanced: true,
    wCR5: branchResult.wCR5?.toFixed(1),
  };
}

// 背景群組掃描快取（含日期戳記）
// ══════════════════════════════════════════════════════
const LS_BG_CACHE   = "cbv2_bg_cache";   // { risk_on: {date, data[]}, risk_off: {date, data[]} }

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
}

function loadBgCache() {
  try { return JSON.parse(localStorage.getItem(LS_BG_CACHE) || "{}"); } catch { return {}; }
}
function saveBgCache(key, data) {
  const all = loadBgCache();
  all[key] = { date: todayStr(), data };
  try { localStorage.setItem(LS_BG_CACHE, JSON.stringify(all)); } catch {}
}
function isBgCacheFresh(key) {
  const all = loadBgCache();
  return all[key]?.date === todayStr() && Array.isArray(all[key]?.data) && all[key].data.length > 0;
}
function getBgCacheData(key) {
  return loadBgCache()[key]?.data || [];
}

// INIT — 智慧啟動流程
// ══════════════════════════════════════════════════════
document.addEventListener("DOMContentLoaded", async () => {
  await loadStockList();

  // 補全群組名稱
  const enrichName = arr => arr.map(s => ({...s, name: stockMap[s.id]?.name || s.name}));
  CORE_RADAR.forEach((s,i) => { if (stockMap[s.id]) CORE_RADAR[i].name = stockMap[s.id].name; });
  Object.keys(BATTLEFIELDS).forEach(k => { BATTLEFIELDS[k] = enrichName(BATTLEFIELDS[k]); });

  // 恢復作戰群組
  const savedBF = loadSavedBattlefield();
  currentBF = savedBF;
  ["core","risk_on","risk_off"].forEach(k => {
    const b = document.getElementById(`bf-${k}`);
    if (b) b.className = `bf-pill${k===savedBF ? ` active-${k}` : ""}`;
  });

  // ★ 核心雷達觀察名單：嚴格只從 localStorage 讀取
  //   risk_on / risk_off 群組則永遠用系統定義，不允許自訂
  if (savedBF === "core") {
    const saved = loadSavedWatchlist();
    watchlist = saved
      ? saved.map(s => ({...s, name: stockMap[s.id]?.name || s.name || s.id}))
      : enrichName([...CORE_RADAR]);
  } else {
    // risk_on / risk_off：永遠用系統定義（不儲存使用者修改）
    watchlist = enrichName([...BATTLEFIELDS[savedBF]]);
  }
  renderWatchlist();

  // ── 智慧啟動：檢查 risk_on / risk_off 快取是否為今日
  const onFresh  = isBgCacheFresh("risk_on");
  const offFresh = isBgCacheFresh("risk_off");

  if (onFresh && offFresh) {
    // 兩組都是今日資料 → 直接載入快取，顯示遷徙雷達，不自動掃描
    const onData  = getBgCacheData("risk_on");
    const offData = getBgCacheData("risk_off");
    _bgCache.risk_on  = onData;
    _bgCache.risk_off = offData;
    renderMigration(calcMigrationFromCache());

    // 顯示上次掃描日期提示
    setError(null);
    document.getElementById("loading-box").style.display = "none";
    const hint = document.getElementById("cache-hint");
    if (hint) {
      hint.textContent = `⚡ 遷徙雷達已載入今日快取（${todayStr().slice(0,4)}/${todayStr().slice(4,6)}/${todayStr().slice(6,8)}）`;
      hint.style.display = "block";
    }
  } else {
    // 有任一組不是今日 → 自動背景掃描兩組，然後等使用者手動掃核心雷達
    autoScanBothGroups();
  }
});

// 自動掃描 risk_on 和 risk_off（不影響主畫面）
async function autoScanBothGroups() {
  const hint = document.getElementById("cache-hint");
  if (hint) { hint.textContent = "⏳ 正在自動掃描 Risk-On 與 Risk-Off 群組，請稍候…"; hint.style.display = "block"; }

  // 先取得大盤環境（評分需要）
  try { regime = await getMarketRegime(); renderRegime(regime); renderRegimeSuggest(regime); } catch {}

  for (const groupKey of ["risk_on", "risk_off"]) {
    if (isBgCacheFresh(groupKey)) {
      // 已是今日，直接用快取
      _bgCache[groupKey] = getBgCacheData(groupKey);
      renderMigration(calcMigrationFromCache());
      continue;
    }
    const group = BATTLEFIELDS[groupKey];
    const results = [];
    for (const s of group) {
      if (hint) hint.textContent = `⏳ 掃描 ${groupKey==="risk_on"?"🚀 Risk-On":"🛡️ Risk-Off"} … ${s.name}(${s.id})`;
      const result = await scanOne(s.id, s);
      if (result) {
        results.push(result);
        _bgCache[groupKey] = [...results];
        renderMigration(calcMigrationFromCache());
      }
      await sleep(600);
    }
    saveBgCache(groupKey, results); // 存入今日快取
  }

  if (hint) {
    hint.textContent = "✅ 兩群組掃描完成，遷徙雷達已更新。請手動點「▶ 開始掃描」掃描核心雷達。";
    hint.style.color = "var(--green)";
  }
}
